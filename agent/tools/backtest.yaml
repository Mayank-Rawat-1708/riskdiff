name: backtest
description: >
  Run a candidate ruleset against the historical labeled transaction
  dataset and compare it to the current live ruleset. Returns catch
  rate, false-positive rate, and per-rule flag counts for both sides of
  the comparison.

  It also returns `patched_yaml`: the CURRENT ruleset file with only
  your change applied to it, comments and formatting otherwise
  untouched. Write that value verbatim into rules/active-ruleset.yaml.
  Do not hand-format the YAML yourself and do not rewrite the file from
  scratch -- both would reformat lines you didn't change, and a rule
  change has to be readable as a small diff. Using `patched_yaml` is
  also what guarantees the ruleset you committed and the ruleset that
  was scored are the same one. `patch_summary` lists, in plain
  language, every value the patch moved; quote it in your response.
input_schema:
  properties:
    candidate_rules_json:
      type: string
      description: >
        JSON array of every rule in the proposed ruleset (not just the
        changed one). Each item: {id, description, condition: {type,
        ...type-specific fields}, action, severity}. Supported
        condition types: "velocity" (fields: field, operator,
        threshold_hours, amount_threshold_inr), "geo_mismatch" (fields:
        amount_threshold_inr), "frequency" (fields: window_minutes,
        count_threshold).
  required: [candidate_rules_json]
implementation:
  script: scripts/backtest.mjs
  runtime: node
